name: Build child play-session APK

on:
  push:
    branches:
      - feature/child-play-session
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK on hosted runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Allow Gradle wrapper
        run: chmod +x gradlew
      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: detoxwall-child-play-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish public test APK (no login required)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA:0:8}"
          TAG="child-play-session-test-${SHORT}"
          ASSET="DetoxWall-ChildTimer-${SHORT}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${ASSET}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Child Timer Android test (${SHORT})" \
              --notes "Experimental ROG Phone 1 play timer: full-screen picker before apps, 5/10/15/30-minute sessions, lock on expiry, screen off/on to begin the next round without a parent PIN. NOT real-device validated. Debug APK can update prior ChildTimer debug install only if its signing key matches, and can coexist with original DetoxWall. Keep only one accessibility service enabled." \
              --prerelease
          fi
          echo "Public APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
