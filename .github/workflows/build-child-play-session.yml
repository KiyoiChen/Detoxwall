name: Build child play-session APK

on:
  push:
    branches:
      - feature/child-play-session
      - feature/rest-break-parent-mode
  workflow_dispatch:

concurrency:
  group: child-timer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK on hosted runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Allow Gradle wrapper
        run: chmod +x gradlew
      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: detoxwall-child-play-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish public test APK (no login required)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA:0:8}"
          TAG="child-play-session-test-${SHORT}"
          ASSET="DetoxWall-ChildTimer-${SHORT}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${ASSET}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Child Timer Android test (${SHORT})" \
              --notes "Experimental ROG Phone 1 ChildTimer Rest Mode. Picker -> chosen time -> automatic 30-minute rest -> picker, 60-minute daily quota, parent PIN offers temporary 15-min access or skip rest. Parents can end temporary mode via persistent notification. NOT real-device validated. Distinct childtimer3 application ID: install alongside old versions, enable only one accessibility service." \
              --prerelease
          fi
          echo "Public APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
