# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ─── JVM / Daemon ────────────────────────────────────────────────────────────
# More heap = fewer GC pauses during compilation; G1GC suits large heaps well.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -Dfile.encoding=UTF-8

# Keep the Gradle daemon alive between builds (default, but explicit is safer).
org.gradle.daemon=true

# How long (ms) an idle daemon stays alive — 3 min is a good default.
org.gradle.daemon.idletimeout=180000

# ─── Parallelism ─────────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.tooling.parallel=true

# ─── Caching ─────────────────────────────────────────────────────────────────
# Build cache: reuses outputs from previous builds (huge speed-up on rebuilds).
org.gradle.caching=true

# Configuration cache: set to 'warn' to avoid "cannot be reused" errors that
# gray out the Run button. Switch back to 'true' once the project is stable.
org.gradle.configuration-cache=warn

# ─── Kotlin ──────────────────────────────────────────────────────────────────
kotlin.code.style=official

# In-process compiler avoids daemon startup overhead on each compile task.
kotlin.compiler.execution.strategy=in-process

# Skip incremental compilation safety checks (safe for most projects).
kotlin.incremental=true

# ─── Android ─────────────────────────────────────────────────────────────────
# Smaller R classes = faster compile + smaller APK.
android.nonTransitiveRClass=true

# Skip unused lint checks during development builds.
android.lint.checkDependencies=false

# Allow the google-services plugin to work even if google-services.json is absent.

# ─── Network resilience ──────────────────────────────────────────────────────
# Higher timeouts help on slow / unstable connections (values in milliseconds).
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=60000
systemProp.https.socketTimeout=120000
